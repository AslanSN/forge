# forge · local infrastructure.
#   make up     → start this
#   make psql   → connect with psql
#   make down   → stop (keeps data)   |   make reset → wipe + fresh + migrate
services:
  db:
    image: postgres:17
    container_name: forge-db
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      # Host port is overridable (see .env) because 5432 is often already taken
      # by another project's stack. Inside the compose network it is always 5432.
      - "${FORGE_DB_PORT:-5432}:5432"
    volumes:
      - forge-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 3s
      timeout: 3s
      retries: 10
  api:
    build: .
    ports:
      - "15000:8080"
    environment:
      FORGE_DB: "Host=db;Port=5432;Database=forge;Username=forge;Password=forge"
      FORGE_URLS: "http://0.0.0.0:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  forge-db-data:
